<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header><img src="icons/icon-32.png" width="24" height="24" alt=""><h1>日文字幕</h1></header>
<section class="feature"><label class="switch"><span>網站文字翻譯<small>日文標題、直播聊天與留言 → 繁中</small></span><input id="websiteText" type="checkbox" checked></label></section><section class="feature"><h2>影片／直播語音字幕</h2><p class="hint">按開始後，讀取目前分頁的聲音。</p><p id="status">檢查中…</p>
<div class="actions"><button id="start">開始語音</button><button id="stop">停止語音</button></div></section>
<section><h2>字幕設定</h2><label>字幕模式（下次開始生效）<select id="captionMode"><option value="record">完整記錄 · 依序翻譯 · 四組字幕</option><option value="realtime">即時優先 · 單組字幕</option></select></label><p class="hint">完整模式在停頓後記錄，翻譯慢也保留排隊。四組字幕隨新句更新；停止收音後仍完成已記錄的翻譯。</p>
<div class="color-row"><label>日文顏色<input id="japaneseColor" type="color" value="#ffffff"></label><label>中文顏色<input id="chineseColor" type="color" value="#ffffff"></label></div>
<label>字幕大小 <output id="fontSizeValue">22 px</output><input id="fontSize" type="range" min="14" max="42" step="1" value="22"></label>
<label>黑框粗細 <output id="outlineWidthValue">1 px</output><input id="outlineWidth" type="range" min="0" max="4" step="0.5" value="1"></label>
<label>字幕框背景顏色<input id="backgroundColor" type="color" value="#000000"></label><label>背景不透明度 <output id="backgroundOpacityValue">60%</output><input id="backgroundOpacity" type="range" min="0" max="100" step="5" value="60"></label>
<label>顯示位置<select id="position"><option value="6">靠近底部</option><option value="12">稍微提高</option><option value="20">畫面中下方</option></select></label>
<label>即時模式最後一句停留 <output id="holdSecondsValue">3 秒</output><input id="holdSeconds" type="range" min="1" max="6" step="1" value="3"></label>
<button id="reset" class="secondary" type="button">恢復預設</button>
</section><details><summary>留言語氣與翻譯服務</summary><p>預設：自然可愛、有禮貌。常用短句免費；其他句子的語氣調整使用你設定的服務，失敗時會標示一般機翻。</p><label>NVIDIA Key<input id="nvidiaKey" type="password" autocomplete="off" placeholder="尚未設定"></label><label>OpenRouter Key<input id="openrouterKey" type="password" autocomplete="off" placeholder="尚未設定"></label><button id="saveTranslation" type="button">儲存翻譯服務</button><p id="translationStatus" role="status"></p></details><details><summary>字幕記錄</summary><p id="recordingStatus"></p><button id="exportRecording">匯出記錄</button> <button id="retryRecording">重試失敗翻譯</button></details><details><summary>執行狀態 · v3.4.2</summary><pre id="diagnostics">等待資料</pre></details></main><script src="popup.js"></script></body></html>
