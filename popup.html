<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header><img src="icons/icon-32.png" width="24" height="24" alt=""><h1>Live Translate</h1></header>
<section class="feature"><label class="switch"><span>網站文字翻譯<small>日文標題、直播聊天與留言 → 繁中</small></span><input id="websiteText" type="checkbox" checked></label></section><section class="feature"><h2>影片／直播語音字幕</h2><p class="hint">按開始後，讀取目前分頁的聲音。</p><p id="status" role="status" aria-live="polite">檢查中…</p>
<label>辨識與翻譯引擎<select id="engineMode"><option value="browser">瀏覽器 WebGPU ＋ 網路翻譯</option><option value="desktop">桌面程式 · 共用引擎設定</option></select></label><p class="hint">桌面模式需要先安裝本機輔助程式，開始時自動啟動。</p><button id="desktopSettings">開啟完整桌面設定</button><p class="hint">引擎、詞彙字典、品質分流與桌面功能在此設定；下次開始語音時套用。</p><div class="actions"><button id="start">開始語音</button><button id="stop">停止語音</button></div></section>
<details class="caption-settings"><summary>字幕外觀與顯示模式</summary><div id="captionPreview" aria-label="字幕外觀預覽"><span id="previewJa">一緒に楽しみましょう。</span><span id="previewZh">一起享受吧。</span></div><label>字幕模式（下次開始生效）<select id="captionMode"><option value="record">完整記錄 · 依序翻譯 · 四組字幕</option><option value="realtime">即時優先 · 單組字幕</option></select></label><p class="hint">完整模式在停頓後記錄，翻譯慢也保留排隊。四組字幕隨新句更新；停止收音後仍完成已記錄的翻譯。</p>
<div class="color-row"><label>日文顏色<input id="japaneseColor" type="color" value="#ffffff"></label><label>中文顏色<input id="chineseColor" type="color" value="#ffffff"></label></div>
<label>字幕大小 <output id="fontSizeValue">22 px</output><input id="fontSize" type="range" min="14" max="42" step="1" value="22"></label>
<label>黑框粗細 <output id="outlineWidthValue">1 px</output><input id="outlineWidth" type="range" min="0" max="4" step="0.5" value="1"></label>
<label>字幕整體不透明度 <output id="captionOpacityValue">100%</output><input id="captionOpacity" type="range" min="0" max="100" step="5" value="100"></label><label>字幕框背景顏色<input id="backgroundColor" type="color" value="#000000"></label><label>背景不透明度 <output id="backgroundOpacityValue">60%</output><input id="backgroundOpacity" type="range" min="0" max="100" step="5" value="60"></label>
<label>顯示位置<select id="position"><option value="6">靠近底部</option><option value="12">稍微提高</option><option value="20">畫面中下方</option></select></label>
<label>即時模式最後一句停留 <output id="holdSecondsValue">3 秒</output><input id="holdSeconds" type="range" min="1" max="6" step="1" value="3"></label>
<button id="reset" class="secondary" type="button">恢復預設</button>
</details><details><summary>留言語氣與翻譯服務</summary><p>預設：自然可愛、有禮貌。常用短句免費；桌面模式使用本機模型產生日文草稿；瀏覽器模式使用已設定的服務。送出前請確認措辭。</p><label>NVIDIA Key<input id="nvidiaKey" type="password" autocomplete="off" placeholder="尚未設定"></label><label>OpenRouter Key<input id="openrouterKey" type="password" autocomplete="off" placeholder="尚未設定"></label><button id="saveTranslation" type="button">儲存翻譯服務</button><p id="translationStatus" role="status"></p></details><details><summary>字幕記錄</summary><p id="recordingStatus"></p><button id="exportRecording">匯出記錄</button> <button id="retryRecording">重試失敗翻譯</button></details><details><summary>執行狀態 · v3.7.2</summary><pre id="diagnostics">等待資料</pre></details></main><script src="popup.js"></script></body></html>
