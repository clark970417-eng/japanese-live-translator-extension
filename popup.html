<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header><img src="icons/icon-32.png" width="24" height="24" alt=""><h1>日文字幕</h1></header>
<p id="status">檢查中…</p>
<div class="actions"><button id="start">開始</button><button id="stop">停止</button></div>
<section><h2>字幕設定</h2>
<div class="color-row"><label>日文顏色<input id="japaneseColor" type="color" value="#ffffff"></label><label>中文顏色<input id="chineseColor" type="color" value="#ffffff"></label></div>
<label>字幕大小 <output id="fontSizeValue">25 px</output><input id="fontSize" type="range" min="14" max="42" step="1" value="25"></label>
<label>黑框粗細 <output id="outlineWidthValue">2 px</output><input id="outlineWidth" type="range" min="0" max="4" step="0.5" value="2"></label>
<label>顯示位置<select id="position"><option value="6">靠近底部</option><option value="12">稍微提高</option><option value="20">畫面中下方</option></select></label>
<button id="reset" class="secondary" type="button">恢復預設</button>
</section><details><summary>執行狀態 · v3.2.1</summary><pre id="diagnostics">等待資料</pre></details></main><script src="popup.js"></script></body></html>
