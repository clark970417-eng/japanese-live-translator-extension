name: Build public beta

on:
  workflow_dispatch:
  push:
    tags: ["beta-v*"]

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - name: Package Chromium extension
        run: |
          mkdir -p beta
          zip -r beta/japanese-live-translator-extension.zip \
            manifest.json background.js offscreen.html offscreen.js audio-worklet.js \
            speech-worker.js vad-worker.js whisper-runtime.js desktop-worker.js native-client.mjs \
            capture-status.mjs cue-cursor.mjs recording-queue.mjs streaming.mjs token-stream.mjs \
            translation-policy.mjs popup.html popup.js popup.css content.js content.css \
            x-content.js x-content.css social-content.js social-content.css \
            caption-window.js caption-window.css icons vendor ort
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: beta/japanese-live-translator-extension.zip

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            command: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
            artifact: macOS
            files: |
              desktop-app/dist/*.dmg
              desktop-app/dist/*-mac.zip
          - os: windows-2025
            command: npx electron-builder --win nsis --x64 --publish never
            artifact: Windows
            files: desktop-app/dist/*.exe
          - os: ubuntu-24.04
            command: npx electron-builder --linux AppImage --x64 --publish never
            artifact: Linux
            files: desktop-app/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
        if: runner.os != 'Windows'
      - run: npm ci --ignore-scripts
        if: runner.os == 'Windows'
      - run: node node_modules/electron/install.js
        if: runner.os == 'Windows'
      - run: node scripts/fix-whisper-addon.js
        if: runner.os == 'Windows'
      - name: Exclude unsupported Windows virtual microphone backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Recurse -Force node_modules/naudiodon -ErrorAction SilentlyContinue
      - run: npm run typecheck
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: npm test -- --run
      - run: npm run build
      - name: Build unsigned beta package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/beta-v')
    needs: [extension, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: beta
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd beta
          find . -maxdepth 1 -type f -name '* *' -print0 | while IFS= read -r -d '' file; do
            mv "$file" "${file// /.}"
          done
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
          jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflow "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{tag:$tag,commit:$commit,builtAt:$builtAt,workflow:$workflow,signed:false,channel:"beta"}' \
            > release-manifest.json
          cd ..
          cat > beta-notes.md <<EOF
          Public preview build. Read the [installation and testing guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/BETA-TESTING.md) before installation.

          Verify downloads with \`SHA256SUMS.txt\`. These packages are not code-signed, so the operating system will show a security warning. Report results through the repository issue forms.
          EOF
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > generated-notes.md
          printf '\n## Changes\n\n' >> beta-notes.md
          cat generated-notes.md >> beta-notes.md
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" beta/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --prerelease --notes-file beta-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" beta/* \
              --repo "${GITHUB_REPOSITORY}" \
              --prerelease \
              --title "Japanese Live Translate ${GITHUB_REF_NAME}" \
              --notes-file beta-notes.md
          fi
