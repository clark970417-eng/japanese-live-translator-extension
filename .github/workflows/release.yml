name: Release desktop app
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
        if: runner.os != 'Windows'
      - run: npm ci --ignore-scripts
        if: runner.os == 'Windows'
      - run: node node_modules/electron/install.js
        if: runner.os == 'Windows'
      - run: node scripts/fix-whisper-addon.js
        if: runner.os == 'Windows'
      - run: npm run typecheck
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: npm test -- --run
      - run: npm run build
  mac:
    needs: verify
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build bundled speaker diarization bridge
        run: |
          cd scripts/fluid-audio
          swift build -c release
          mkdir -p ../../resources/bin
          cp .build/release/fluid-audio-bridge ../../resources/bin/fluid-audio-bridge
      - name: Require Apple distribution credentials
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "Missing required signing secret: $name"; exit 1; }
          done
      - name: Sign, notarize and publish macOS package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish always --config.mac.notarize=true
  windows-linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: --win nsis --x64
          - os: ubuntu-24.04
            target: --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
        if: runner.os != 'Windows'
      - run: npm ci --ignore-scripts
        if: runner.os == 'Windows'
      - run: node node_modules/electron/install.js
        if: runner.os == 'Windows'
      - run: node scripts/fix-whisper-addon.js
        if: runner.os == 'Windows'
      - name: Exclude unsupported Windows virtual microphone backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Recurse -Force node_modules/naudiodon -ErrorAction SilentlyContinue
      - name: Require Windows signing credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK) { throw 'Missing required signing secret: WINDOWS_CERTIFICATE_PFX' }
          if (-not $env:CSC_KEY_PASSWORD) { throw 'Missing required signing secret: WINDOWS_CERTIFICATE_PASSWORD' }
      - run: npm run build
      - name: Build installer and publish update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PFX || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: npx electron-builder ${{ matrix.target }} --publish always

  finalize-release:
    needs: [mac, windows-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download published installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "${GITHUB_REF_NAME}" --dir release-assets --repo "${GITHUB_REPOSITORY}" \
            --skip-existing --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe' --pattern '*.AppImage' \
            --pattern '*.yml' --pattern '*.blockmap'
      - name: Generate verification and provenance files
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt
          jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg commit "${GITHUB_SHA}" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflow "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{tag:$tag,commit:$commit,builtAt:$builtAt,workflow:$workflow,signedTargets:["macos","windows"],channel:"stable"}' \
            > release-manifest.json
      - name: Upload verification files and generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" release-assets/SHA256SUMS.txt release-assets/release-manifest.json \
            --repo "${GITHUB_REPOSITORY}" --clobber
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > generated-notes.md
          {
            echo 'Downloads can be verified with `SHA256SUMS.txt`. Build provenance is recorded in `release-manifest.json`.'
            echo
            cat generated-notes.md
          } > release-notes.md
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --draft=false --notes-file release-notes.md
